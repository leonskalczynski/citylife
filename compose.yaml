services:
  postgres:
    image: postgres:17-alpine
    container_name: urban-pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urbanpulse}
      POSTGRES_USER: ${POSTGRES_USER:-urbanpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbanpulse_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Legacy volume name kept so existing local data is not lost.
      - citylife_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urbanpulse} -d ${POSTGRES_DB:-urbanpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  citylife_postgres_data:

