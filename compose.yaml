services:
  postgres:
    image: postgres:17-alpine
    container_name: citylife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citylife}
      POSTGRES_USER: ${POSTGRES_USER:-citylife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citylife_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - citylife_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citylife} -d ${POSTGRES_DB:-citylife}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  citylife_postgres_data:

