spring:
  application:
    name: citylife-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/citylife}
    username: ${DB_USERNAME:citylife}
    password: ${DB_PASSWORD:citylife_local_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    ttl: ${JWT_TTL:15m}
  attachments:
    storage-path: ${ATTACHMENT_STORAGE_PATH:./data/attachments}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui

