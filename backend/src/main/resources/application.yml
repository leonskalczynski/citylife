spring:
  application:
    name: citylife-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/citylife}
    username: ${DB_USERNAME:citylife}
    password: ${DB_PASSWORD:citylife_local_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui

