spring:
  datasource:
    url: jdbc:h2:mem:citylife;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false

app:
  cors:
    allowed-origin: http://localhost:5173

