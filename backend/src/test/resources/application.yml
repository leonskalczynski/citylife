spring:
  datasource:
    url: jdbc:h2:mem:citylife;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  jwt:
    secret-base64: dGVzdC1zZWNyZXQtZm9yLWNpdHlsaWZlLW11c3QtYmUtMzItYnl0ZXMtbG9uZw==
    ttl: 15m
  attachments:
    storage-path: ./target/test-attachments

